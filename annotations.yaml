# ═══════════════════════════════════════════════════════════════════════
#  Hierarchical Divine Liturgy — deacon training video
#  DRAFT FORMAT, round 3. Real content, clips 1–3 only.
#
#  One block per clip, in order. The clip number IS the block, so it can
#  never go missing the way it did in the spreadsheet export.
#
#  Singular and plural key names mean the same thing everywhere:
#  annotation/annotations, card/cards, cut/cuts, note/notes, todo/todos.
#  Write whichever reads better for what you have.
#
#  ── Chapters ──────────────────────────────────────────────────────────
#    chapter: always means "a chapter starts here, titled this".
#    Present → a chapter starts. Absent → it doesn't. That is the whole rule.
#
#    On a clip:  names the chapter beginning at that clip.
#    On a card:  the card becomes its own chapter with that title. A card
#                with no chapter: folds into the chapter that follows it —
#                that chapter simply starts earlier, at the card.
#
#  ── Cards play BEFORE the clip they are listed under ───────────────────
#    A card introduces its clip. Use `after: true` for a card that should
#    trail the clip instead — needed only at the very end of the video.
#    A `clip: 0` block means "before everything".
#
#  ── Speed-ups and cuts ────────────────────────────────────────────────
#    Write them inline in the annotations list, marked `speed: true` or
#    `cut: true`, and the list reads in the order things happen. Both ends
#    must be given (a span cannot continue from whatever preceded it), and a
#    span never affects where the next annotation picks up.
#
#  ── Speed-ups and cuts ────────────────────────────────────────────────
#    Write them inline in the annotations list, marked `speed: true` or
#    `cut: true`, and the list reads in the order things happen. Both ends
#    must be given (a span cannot continue from whatever preceded it), and a
#    span never affects where the next annotation picks up.
#
#      speed: 4x      four times normal. 4 and 2.5x parse too;
#                     speed: true uses the global --speed rate.
#      audio: normal  what the span sounds like:
#                       mute    silence (the default)
#                       fast    time-stretched to fit; pitch intact, hurried
#                       normal  natural speed — the opening of the span plays
#                               untouched for as long as the sped video lasts,
#                               then fades out. Right for background singing.
#      hold: 4        seconds at full volume before that fade (default 4).
#
#    Separate `speed:` and `cuts:` blocks also work if you prefer them.
#
#    NOTE: a key cannot repeat in one clip. Writing `annotations:` twice
#    silently discards the first list — YAML does not complain. Keep one list
#    per clip and put spans inside it.
#
#  ── Where text ends up ────────────────────────────────────────────────
#    annotations:  on screen, timed — and also in the printed document
#    notes:        printed document ONLY; never on screen.
#    todos:        yours alone. Never on screen, never printed.
#
#    notes: and todos: may each be a block of prose or a list of separate
#    points, and may be attached to a clip, to a card, or to a single
#    annotation. The written document is an outline built from these fields
#    in order, so put a note where the thing it explains lives.
#
#  ── Timing ────────────────────────────────────────────────────────────
#    End:    for: = how long it stays up, counted from the start
#            to:  = an absolute position in the clip
#            Give one or the other, never both.
#
#    Start:  LEAVE IT OUT and the annotation picks up 0.2s after the previous
#            one ends — or at 0 if it is the first in the clip. Most
#            annotations need nothing more than a `for:` and a `text:`.
#
#            Leave `for:` out too and it stays up 4s, so the shortest useful
#            annotation is just a line of text.
#
#            at: 1:27      an absolute position, when you need to pin one down
#            at: next+1.5  continue, but wait 1.5s instead of 0.2s
#            from:         a synonym for at:
#            ("next", "C" and "C+1.5" still work.)
#
#    Write times bare — no quotes. 1:27, 1:03:23, 0:04, 87 and 4.5 all work.
#
#  ── Text ──────────────────────────────────────────────────────────────
#    Put prose under `text: >` (folds to one line) or `text: |` (keeps your
#    line breaks). Neither needs quoting or escaping — commas, colons,
#    apostrophes and quotation marks all pass through untouched.
#
#    Never put prose inside { }. There, a comma ends the value and the rest
#    of your sentence silently becomes a key. Run check_sheet.py to catch it.
# ═══════════════════════════════════════════════════════════════════════

# ─── Opening card, before everything ───────────────────────────────────
- clip: 0
  card:
    - text: |
        Hierarchical Divine Liturgy
        Deacon Training
        20 June 2026
      for: 8
      # no chapter: → folds into chapter 1, which then starts here at 0:00


# ─── 1 ─────────────────────────────────────────────────────────────────
- clip: 1
  chapter: Greeting of the Hierarch at the Doors

  # Plays BEFORE clip 1. No chapter:, so it folds into chapter 1 and becomes
  # its title card.
  cards:
    - for: 8
      text: |
        Greeting of the Hierarch at the Doors

        What is the order of greeting?
        Children — flowers.
        Parish Council President — bread and salt.

  annotations:
    # No `at:` on the first annotation → starts at 0.
    - at: 6
      for: 4
      role: SERVERS
      text: Subdeacons or altar servers place the Mantiya
      notes: Placing the Mantiya should be practiced the night before

    # No `at:` → picks up 0.2s after the one above ends.
    - for: 4
      role: DEACONS
      text: Continuously cense the bishop

    - for: 10
      text: Notice arrangement of priests in order of seniority with deacons behind them.

    # these few seconds look strange so cut them
    - from: 33
      to: 38
      cut: true

    # A span written inline, so the list reads in time order.
    - from: 38
      to: 1:18
      speed: 6x          # plays fast, audio muted
      audio: normal
      role: PRIEST
      text: Greets Bishop...
      note: In the parish setting the lead priest is the rector, for other situations consult your Dean.

    - at: 1:22
      for: 4
      role: PRIEST
      text: At the conclusion, the priest presents the cross
      notes: |
        The cross should be carried on a tray, with the handle to the priests left.
        This ensures that the Bishop can pick it up easily with his right hand.
      # todos: Confirm which priest presents when the rector is absent.

  notes:
    - Parish Council President should be prepared with Bread and salt
    - Children should come with flowers
    - Priest should be ready with a blessing cross on a tray with handle to the priest's left
    # Salvaged from the original CSV note — your line above covers rank order
    # but not the rector-at-center geometry. Delete if it's redundant.
    - Rector at center, other priests to south and north sides of the church
    - Other priests present should be lined up in order of rank inside the Nave
    - Deacons should be ready with censers behind the priests (towards the altar)
    - Two vested servers should be ready at the doors with the Mantiya
    # Also salvaged from the original CSV note — not covered by your lines above.
    - One subdeacon or altar server holds the train of the Mantiya
    - Two additional servers should be in the narthex ready to follow and assist

  todos: |
    This should be practiced the night before.


# ─── 2 ─────────────────────────────────────────────────────────────────
- clip: 2
  chapter: The Bishop Enters the Nave
  card: 
    for: 8
    text: The Bishop Greets the Clergy, and Enters the Nave

  annotations:
    - at: 1
      for: 7
      text: >
        The priests in order kiss the cross, and the Bishop's hand and receive
        the blessing,

    - at: 9
      for: 5
      text: >
        Then the presiding priest does the same, and is given back the cross
        on his tray

    - at: 16
      for: 4
      role: FIRST DEACON
      text: >
        "Bless, master, the holy incense" - Both Deacons hold up their censers

    - at: 27
      for: 3
      role: SECOND DEACON
      text: Wisdom!

    - for: 4
      text: Deacons turn around and walk forward toward cathedra

    - for: 4
      role: CHOIR
      text: >
        While the first deacon, chants and the choir sings - "it is truly meet…"

    - at: 42
      for: 5
      text: >
        Deacons walk past cathedra, turn around and continue to cense the Bishop

    - at: 56
      for: 4
      role: SERVERS
      text: >
        Deacons turn towards the altar, as Bishop walks past, giving their
        censers away
    
    - at: 1:00
      for: 4
      role: SERVERS
      text: The server holding the train takes the staff, and the Bishop will greet the icons
    
    - for: 4
      role: SERVERS
      text: The two servers holding the censers return them to the altar


# ─── 3 ─────────────────────────────────────────────────────────────────
- clip: 3
  chapter: Entrance Prayers

  card:
    for: 8
    text:  Entrance Prayers

  annotations:
    # 'to:' here instead of 'for:' — an absolute end, shown for illustration.
    - at: 15
      for: 7
      role: FIRST DEACON
      text: |
        reads the entrance prayers quietly,
        As normal, BUT stops before "I will enter thy house"
    - from: 30
      to: 2:40
      cut: true 

# ─── The remaining row types, for completeness ─────────────────────────

# Drop a clip from the build entirely.
- clip: 13
  skip: true

# Remove spans from a clip. Both ends are positions in the ORIGINAL clip, and
# later times in this sheet still refer to the original — the build maps them.
- clip: 19
  cuts:
    - from: 1:00
      to: 2:00


# ─── Cards further along, kept here to show the shape ──────────────────

# Was "after clip 20" in the CSV; before clip 21 is the same gap, and reads as
# the card that introduces clip 21. chapter: present → its own chapter, and the
# chapter title can differ from the words on screen.
- clip: 21
  cards:
    - text: Homily
      for: 6
      chapter: Homily — not shown
      notes: The homily is not filmed; roughly 18 minutes of the service.
    # A card may show an image instead of, or behind, its text:
    # - image: art/great-entrance.png
    #   for: 6
    #   chapter: The Great Entrance

- clip: 26
  cards:
    - text: The Great Entrance
      for: 5          # no chapter: → folds into chapter 26
