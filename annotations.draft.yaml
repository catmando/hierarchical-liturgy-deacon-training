# ═══════════════════════════════════════════════════════════════════════
#  Hierarchical Divine Liturgy — deacon training video
#  DRAFT FORMAT for review. Real content, clips 1–3 only.
#
#  One block per clip, in order. The clip number is the block, so it can
#  never go missing the way it did in the spreadsheet export.
#
#  Every time is measured on the ORIGINAL, untouched clip. Cards, cuts and
#  edits never shift anything — the build maps times through them.
#
#    annotations:  at = when it appears,  for = how long it stays up
#    speed / cut:  from → to are both positions in the clip
#
#  "at: C" means continue 0.2s after the previous annotation. "C+1.5" waits
#  longer. Quote any time containing a colon.
# ═══════════════════════════════════════════════════════════════════════

# ─── Opening card, before everything ───────────────────────────────────
- clip: 0
  cards:
    - text: |
        Hierarchical Divine Liturgy
        Deacon Training
        20 June 2026
      for: 8
      own_chapter: false      # a section title: folds into the chapter that follows


# ─── 1 ─────────────────────────────────────────────────────────────────
- clip: 1
  chapter: Greeting of the Hierarch at the Doors

  # Working notes. Never burned into the video — unlike the CSV, where these
  # sat inside the chapter title and collapsed into one very long chapter name.
  notes: |
    ? What is the order of greeting — warden? Priest? Children?
        Children — flowers
        Parish Council President — bread and salt

    Rector at center, other priests to south and north sides of the church.
    (Don't forget to carry the cross handle to the priest's left.)

    Deacons 1 and 2 ready to cense.

    Subdeacons or altar servers ready at the door to place the mantiya.
    (This should be practiced the night before.)

    One subdeacon or altar server holds the train of the mantiya.

  annotations:
    - { at: 0,      for: 4, role: AS1+2,   text: Subdeacons or altar servers place the mantilla }
    - { at: C,      for: 3, role: DEACONS, text: Continuously cense the bishop }
    - { at: "1:27", for: 4, role: PRIEST,  text: "At the conclusion, the priest presents the cross" }

  speed:
    - { from: 38, to: "1:20", role: PRIEST, text: Greets Bishop… }


# ─── 2 ─────────────────────────────────────────────────────────────────
- clip: 2
  chapter: The Bishop Enters the Nave

  annotations:
    - at: 1
      for: 7
      text: "The priests in order kiss the cross, and the Bishop's hand and receive the blessing"

    - at: 9
      for: 5
      text: Then the presiding priest does the same, and is given back the cross on his tray

    - at: 25
      for: 3
      role: D1
      text: '"Bless, master, the holy incense" — both deacons hold up their censers'

    - { at: C, for: 2, text: 'First Deacon: "Wisdom"' }
    - { at: C, for: 2, text: Deacons turn around and walk forward toward cathedra }

    - at: C
      for: 4
      role: CHOIR
      text: While the first deacon chants, the choir sings "It is truly meet…"

    - { at: 44,     for: 3, text: "Deacons walk past cathedra, turn around and continue to cense the Bishop" }
    - { at: "1:00", for: 4, role: AS3+4, text: "Deacons turn towards the altar, as Bishop walks past, giving their censers away" }
    - { at: "1:05", for: 4, role: AS1+2, text: "A server takes the staff, and the Bishop will greet the icons" }


# ─── 3 ─────────────────────────────────────────────────────────────────
- clip: 3
  chapter: Entrance Prayers
  notes: TRIM THE END OF THIS OFF

  annotations:
    - at: 15
      for: 4
      role: D1
      text: |
        Deacon 1 reads the entrance prayers quietly.
        As normal, BUT stop before "I will enter thy house".


# ─── Cards further along, kept here to show the shape ──────────────────
- clip: 20
  cards:
    - { text: Homily, for: 6, own_chapter: true }     # standalone card = its own chapter

- clip: 25
  cards:
    - { text: The Great Entrance, for: 5, own_chapter: false }
