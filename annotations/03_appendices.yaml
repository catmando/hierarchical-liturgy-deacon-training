- appendix: E
  heading: Roles for Concelebrating Deacons
  image: art/roles_chart.png
  text: |
    The diocesan chart, for two through eight deacons. Read down for the
    moment in the liturgy and across for the number of deacons serving;
    the figure in the cell is the deacon who takes that part. Where two
    numbers are given, both serve together.

    Everything else in these rubrics describes **two** deacons, which is
    the ordinary case. This chart is what to consult when there are more,
    or when you are asked to serve at a cathedral or a diocesan feast
    where there may be many.

    A version sized to be cut out and kept in a service book is available
    as a printable sheet: [download the card](https://catmando.github.io/hierarchical-liturgy-deacon-training/roles_card.pdf).
    Print it at **100%** — not "fit to page", which would shrink it — and
    cut along the dashed line. The card is 3⅜ × 5¼ inches.

    *Source: diocesan chart, Pdn. K. Sokolov, revised 1 June 2008.*
