<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .bg   { fill:#0b0b0d; }
      .wall { fill:none; stroke:#e8e2d6; stroke-width:5; }
      .nave { fill:#141418; stroke:#33333c; stroke-width:2.5; }
      .nart { fill:#1b1820; stroke:#413b4a; stroke-width:2.5; }
      .arch { fill:#8a8a94; font-family:Georgia,serif; font-size:25px; text-anchor:middle; }
      .gold { fill:#d9b45b; font-family:Georgia,serif; font-size:26px; text-anchor:middle; }
      .name { font-family:Georgia,serif; font-size:23px; text-anchor:middle; font-weight:bold; }
      .ttl  { fill:#f0ece2; font-family:Georgia,serif; font-size:46px; text-anchor:middle; }
      .fig  { stroke:#0b0b0d; stroke-width:3; }
      .cmp  { fill:#7a7a84; font-family:Georgia,serif; font-size:23px; text-anchor:middle; }
      .lgd  { fill:#a8a8b2; font-family:Georgia,serif; font-size:23px; text-anchor:start; }
      .cap  { fill:#8a8a94; font-family:Georgia,serif; font-size:22px; }
      .capc { fill:#8a8a94; font-family:Georgia,serif; font-size:22px; text-anchor:middle; }
    </style>
  </defs>
  <rect class="bg" width="1920" height="1080"/>
  <text class="ttl" x="960" y="66">The Greeting at the Doors</text>

  <rect class="nave" x="470" y="128" width="980" height="512"/>
  <rect class="nart" x="470" y="640" width="980" height="320"/>
  <path class="wall" d="M470,128 L470,960 L1450,960 L1450,128"/>
  <line x1="470" y1="640" x2="1450" y2="640" stroke="#413b4a" stroke-width="2.5"/>

  <line x1="800" y1="960" x2="1120" y2="960" stroke="#d9b45b" stroke-width="13" stroke-linecap="round"/>
  <text class="gold" x="960" y="1008">THE DOORS</text>
  <text class="arch" x="960" y="168">&#8593;  toward the altar  &#8593;</text>
  <text class="cap" x="500" y="204" style="fill:#5f5f6a">NAVE</text>
  <text class="cap" x="500" y="946" style="fill:#5f5f6a">NARTHEX</text>

  <!-- deacons close the east end of each line -->
  <circle class="fig" cx="852" cy="252" r="30" fill="#e0912c"/>
  <circle class="fig" cx="1068" cy="252" r="30" fill="#e0912c"/>
  <text class="name" x="852" y="260" fill="#1a1a1a">D2</text>
  <text class="name" x="1068" y="260" fill="#1a1a1a">D1</text>
  <text class="capc" x="960" y="212">deacons close each line, censing continuously</text>

  <!-- two lines of priests, running east to west either side of the rector -->
  <circle class="fig" cx="852" cy="352" r="30" fill="#a8e0a8"/>
  <circle class="fig" cx="852" cy="446" r="30" fill="#a8e0a8"/>
  <circle class="fig" cx="1068" cy="352" r="30" fill="#a8e0a8"/>
  <circle class="fig" cx="1068" cy="446" r="30" fill="#a8e0a8"/>
  <text class="name" x="852" y="360" fill="#1a1a1a">P</text>
  <text class="name" x="852" y="454" fill="#1a1a1a">P</text>
  <text class="name" x="1068" y="360" fill="#1a1a1a">P</text>
  <text class="name" x="1068" y="454" fill="#1a1a1a">P</text>

  <text class="cap" x="600" y="346">junior</text>
  <text class="cap" x="600" y="452">senior</text>
  <text class="cap" x="1156" y="400">however many are</text>
  <text class="cap" x="1156" y="428">serving &#8212; none to a dozen</text>

  <!-- rector, at the head of both lines, nearest the doors -->
  <circle cx="960" cy="556" r="38" fill="none" stroke="#d9b45b" stroke-width="3"/>
  <circle class="fig" cx="960" cy="556" r="31" fill="#d96a68"/>
  <text class="name" x="960" y="564" fill="#1a1a1a">R</text>
  <text class="cap" x="1020" y="550">Rector, with the cross on a tray,</text>
  <text class="cap" x="1020" y="578">handle to his left</text>

  <!-- ── narthex ─────────────────────────────────────────────────── -->
  <text class="cap" x="500" y="682" style="fill:#6f6a78">everyone below the rector waits in the narthex</text>

  <!-- the flowers and the bread and salt stand nearest the altar, with the
       subdeacons behind them -->
  <circle class="fig" cx="790" cy="762" r="30" fill="#93c4e8"/>
  <text class="name" x="790" y="770" fill="#1a1a1a">Ch</text>
  <text class="capc" x="790" y="812">flowers</text>

  <circle class="fig" cx="1130" cy="762" r="30" fill="#b3893c"/>
  <text class="name" x="1130" y="770" fill="#1a1a1a">PC</text>
  <text class="capc" x="1130" y="812">bread and salt</text>

  <text class="capc" x="960" y="830">two subdeacons, and any servers helping</text>
  <text class="capc" x="960" y="856">one of them carries the Mantiya, or hands it to a junior server</text>
  <circle class="fig" cx="820" cy="900" r="30" fill="#9b74b8"/>
  <circle class="fig" cx="1100" cy="900" r="30" fill="#9b74b8"/>
  <text class="name" x="820" y="908" fill="#1a1a1a">SD</text>
  <text class="name" x="1100" y="908" fill="#1a1a1a">SD</text>

  <circle class="fig" cx="660" cy="900" r="28" fill="#7d8598"/>
  <circle class="fig" cx="1260" cy="900" r="28" fill="#7d8598"/>
  <text class="name" x="660" y="908" fill="#1a1a1a">S</text>
  <text class="name" x="1260" y="908" fill="#1a1a1a">S</text>

  <!-- legend -->
  <circle class="fig" cx="1608" cy="220" r="19" fill="#d96a68"/>
  <text class="lgd" x="1642" y="228">R &#8212; Rector</text>
  <circle class="fig" cx="1608" cy="272" r="19" fill="#a8e0a8"/>
  <text class="lgd" x="1642" y="280">P &#8212; Priests</text>
  <circle class="fig" cx="1608" cy="324" r="19" fill="#e0912c"/>
  <text class="lgd" x="1642" y="332">D &#8212; Deacons</text>
  <circle class="fig" cx="1608" cy="376" r="19" fill="#9b74b8"/>
  <text class="lgd" x="1642" y="384">SD &#8212; Subdeacons</text>
  <circle class="fig" cx="1608" cy="428" r="19" fill="#7d8598"/>
  <text class="lgd" x="1642" y="436">S &#8212; Servers</text>
  <circle class="fig" cx="1608" cy="480" r="19" fill="#93c4e8"/>
  <text class="lgd" x="1642" y="488">Ch &#8212; Children</text>
  <circle class="fig" cx="1608" cy="532" r="19" fill="#b3893c"/>
  <text class="lgd" x="1642" y="540">PC &#8212; Council President</text>

  <text class="cmp" x="268" y="216">EAST &#183; altar</text>
  <text class="cmp" x="268" y="440">north &#8592;   &#8594; south</text>
  <text class="cmp" x="268" y="962">WEST</text>
</svg>
